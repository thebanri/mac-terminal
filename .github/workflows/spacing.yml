name: spacing
# Does a smaller line spacing let Terminal.app's block glyphs fill the cell?
on: workflow_dispatch
jobs:
  spacing:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Open a window per line spacing
        run: |
          mkdir -p shots
          for s in 1.0 0.9 0.85 0.8 0.75; do
            cat > "sp$s.terminal" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>name</key><string>sp$s</string>
            <key>type</key><string>Window Settings</string>
            <key>FontHeightSpacing</key><real>$s</real>
            <key>columnCount</key><integer>60</integer>
            <key>rowCount</key><integer>14</integer>
            <key>CommandString</key><string>python3 $PWD/scripts/blocks.py</string>
            <key>RunCommandAsShell</key><false/>
          </dict></plist>
          PLIST
            open "sp$s.terminal"
            sleep 5
            screencapture -x "shots/sp$s.png"
            killall Terminal || true
            sleep 2
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
